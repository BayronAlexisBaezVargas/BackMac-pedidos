spring:
  application:
    name: ms-pedidos

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/pedidos_db}
    username: ${SPRING_DATASOURCE_USERNAME:springuser}
    password: ${SPRING_DATASOURCE_PASSWORD:springpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/c59a4270-0c88-46d9-a708-38639783c0b1/discovery/v2.0/keys
          audiences:
            - 24a66d14-c9c3-41c1-a93b-7e5926389c91
            - api://24a66d14-c9c3-41c1-a93b-7e5926389c91

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        acknowledge-mode: manual

server:
  port: 8083

servicios:
  carrito:
    url: ${CARRITO_SERVICE_URL:http://localhost:8082/api/carrito}
  productos:
    url: ${PRODUCTOS_SERVICE_URL:http://localhost:8081/api/productos}

app:
  rabbitmq:
    exchange: pedidos360.exchange
    dlx: pedidos360.dlx
    queues:
      pagos: pagos.queue
      pagos-dlq: pagos.dlq
      pedidos-estado: pedidos.estado.queue
      pedidos-estado-dlq: pedidos.estado.dlq
      notificaciones: notificaciones.queue
      notificaciones-dlq: notificaciones.dlq
    routing-keys:
      pagos: pagos.routing.key
      pagos-dlq: pagos.dlq.routing.key
      pedidos-estado: pedidos.estado.routing.key
      pedidos-estado-dlq: pedidos.estado.dlq.routing.key
      notificaciones: notificaciones.routing.key
      notificaciones-dlq: notificaciones.dlq.routing.key
